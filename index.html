<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Risolutore Quiz Rapido</title>

<style>
:root {
    --bg: #f4f6f9;
    --primary: #2563eb;
    --text: #1f2937;
    --border: #e5e7eb;
}

body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 700px;
    margin: 30px auto;
    padding: 15px;
}

.container {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 12px #0001;
}

h1 {
    text-align: center;
    color: #1e3a8a;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 10px;
}

.section {
    margin-bottom: 20px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 6px;
    background: var(--primary);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    background: #9ca3af;
}

#status {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
    overflow-wrap: anywhere;
}

#result-container {
    display: none;
    margin-top: 20px;
}

#result-box {
    padding: 15px;
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: monospace;
    font-size: 18px;
    overflow-wrap: anywhere;
}

.copy-btn {
    margin-top: 10px;
    background: #10b981;
}

</style>
</head>

<body>

<div class="container">

<h1>Risolutore Quiz Rapido</h1>

<div class="section">
<label for="apiKey">API Key Gemini</label>
<input type="password" id="apiKey"
placeholder="Inserisci la tua API Key">
</div>

<div class="section">
<label for="quizFiles">
Carica le immagini dei quiz (massimo 30)
</label>

<input type="file" id="quizFiles"
multiple accept="image/*">

<p id="fileCount">Nessuna immagine selezionata</p>
</div>

<button id="processBtn" onclick="processQuiz()">
RISOLVI QUIZ
</button>

<div id="status"></div>

<div id="result-container">

<label>Risposte:</label>

<div id="result-box"></div>

<button class="copy-btn" onclick="copyResults()">
COPIA RISPOSTE
</button>

</div>

</div>

<script>

const MODEL = "gemini-3.5-flash-lite";

const apiKeyInput = document.getElementById("apiKey");
const quizInput = document.getElementById("quizFiles");
const processBtn = document.getElementById("processBtn");
const statusDiv = document.getElementById("status");
const resultBox = document.getElementById("result-box");
const resultContainer = document.getElementById("result-container");

// Conteggio immagini
quizInput.addEventListener("change", function() {

    const count = quizInput.files.length;

    document.getElementById("fileCount").textContent =
        count + " immagini selezionate";

});

// Conversione immagini
function fileToPart(file) {

    return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = function() {

            resolve({
                inlineData: {
                    mimeType: file.type,
                    data: reader.result.split(",")[1]
                }
            });

        };

        reader.onerror = function() {
            reject(new Error("Errore lettura immagine"));
        };

        reader.readAsDataURL(file);

    });

}

// Attesa in caso di sovraccarico
function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

// Elaborazione quiz
async function processQuiz() {

    const apiKey = apiKeyInput.value.trim();
    const files = Array.from(quizInput.files);

    if (!apiKey) {
        alert("Inserisci la API Key Gemini.");
        return;
    }

    if (files.length === 0) {
        alert("Carica le immagini dei quiz.");
        return;
    }

    if (files.length > 30) {
        alert("Puoi caricare massimo 30 immagini.");
        return;
    }

    processBtn.disabled = true;
    resultContainer.style.display = "none";

    statusDiv.style.color = "#2563eb";
    statusDiv.textContent = "Preparazione immagini...";

    try {

        const imageParts = [];

        for (const file of files) {

            if (!file.type.startsWith("image/")) {
                throw new Error("File non valido: " + file.name);
            }

            imageParts.push(await fileToPart(file));

        }

        const prompt = `
AGISCI COME UN DOCENTE UNIVERSITARIO DI STATISTICA,
LAUREATO IN STATISTICA, CON PREPARAZIONE AVANZATA
IN STATISTICA MATEMATICA, INFERENZA STATISTICA,
PROBABILITA', ECONOMETRIA E ANALISI DEI DATI.

Il tuo compito è risolvere quiz universitari a risposta
multipla con la MASSIMA PRECISIONE POSSIBILE.

OBIETTIVO:
Non devi rispondere velocemente sacrificando la precisione.
Devi individuare la risposta scientificamente e
matematicamente corretta.

PROCEDURA OBBLIGATORIA PER OGNI DOMANDA:

1. Leggi integralmente il testo della domanda.
2. Analizza tutte le alternative A, B, C e D.
3. Identifica l'argomento statistico specifico.
4. Individua la definizione, la formula o il teorema
   pertinente.
5. Se la domanda contiene calcoli:
   - individua i dati;
   - applica la formula corretta;
   - verifica i passaggi matematici;
   - controlla il risultato numerico;
   - considera eventuali arrotondamenti.
6. Se la domanda riguarda una definizione:
   - distingui i concetti simili;
   - verifica le condizioni di validità;
   - non confondere termini statistici.
7. Esamina tutte le alternative.
8. Elimina le risposte errate e individua quella corretta.
9. Esegui una seconda verifica indipendente della risposta.
10. Prima di confermare, verifica che la risposta scelta
    corrisponda esattamente all'alternativa indicata.

ATTENZIONE AI TRANELLI:

- Confusione tra media, mediana e moda.
- Confusione tra varianza e deviazione standard.
- Confusione tra probabilità condizionata e indipendenza.
- Confusione tra correlazione e causalità.
- Confusione tra ipotesi nulla e alternativa.
- Confusione tra errore di I tipo e II tipo.
- Confusione tra campione e popolazione.
- Confusione tra stimatore e stima.
- Confusione tra distribuzioni statistiche.
- Formule con denominatori differenti.
- Segni, unità di misura e arrotondamenti.
- Alternative quasi identiche.
- Definizioni formulate in modo ingannevole.

REGOLE:

- Non scegliere una risposta soltanto perché sembra plausibile.
- Non inventare dati mancanti.
- Non ignorare nessuna alternativa.
- Non rispondere prima di aver verificato.
- Se una domanda è ambigua o illeggibile,
  non inventare una soluzione.
- Ogni immagine corrisponde a una domanda.
- Mantieni l'ordine originale delle immagini.

VERIFICA FINALE:

Controlla nuovamente tutte le domande.
Verifica la correttezza matematica e concettuale.
Verifica che nessuna risposta sia stata associata
alla domanda sbagliata.
Verifica il numero totale delle risposte.

FORMATO DI OUTPUT OBBLIGATORIO:

1:A;2:C;3:B;4:D

Restituisci ESCLUSIVAMENTE la stringa delle risposte.
Nessuna spiegazione.
Nessun commento.
Nessun testo aggiuntivo.

Numero di domande: ${files.length}
`;

        const contents = [{
            role: "user",
            parts: [
                { text: prompt },
                ...imageParts
            ]
        }];

        let data;
        let response;

        // Massimo 3 tentativi in caso di sovraccarico
        for (let attempt = 0; attempt < 3; attempt++) {

            statusDiv.textContent =
                attempt === 0
                ? "Gemini sta risolvendo i quiz..."
                : "Modello sovraccarico. Nuovo tentativo...";

            response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        contents: contents,

                        generationConfig: {
                            temperature: 0,
                            maxOutputTokens: 1024
                        }
                    })
                }
            );

            data = await response.json();

            if (response.ok && !data.error) {
                break;
            }

            const errorMessage =
                data.error?.message || "";

            const isOverloaded =
                /high demand|overload|503|UNAVAILABLE/i
                .test(errorMessage);

            if (!isOverloaded || attempt === 2) {
                throw new Error(errorMessage ||
                    "Errore API " + response.status);
            }

            await sleep(1000 * Math.pow(2, attempt));

        }

        const candidate = data.candidates?.[0];

        if (!candidate?.content?.parts) {
            throw new Error("Risposta Gemini vuota.");
        }

        let output = candidate.content.parts
            .map(part => part.text || "")
            .join("")
            .trim();

        output = output
            .replace(/```/g, "")
            .replace(/\s/g, "");

        const pattern =
            /^\d+:[1-4](;\d+:[1-4])*$/;

        if (!pattern.test(output)) {
            throw new Error(
                "Formato risposta non valido: " + output
            );
        }

        const answers = output.split(";");

        if (answers.length !== files.length) {
            throw new Error(
                "Risposte ricevute: " + answers.length +
                ". Immagini caricate: " + files.length
            );
        }

        for (let i = 0; i < answers.length; i++) {

            const number =
                parseInt(answers[i].split(":")[0]);

            if (number !== i + 1) {
                throw new Error(
                    "Numerazione delle risposte errata."
                );
            }

        }

        resultBox.textContent = output;
        resultContainer.style.display = "block";

        statusDiv.style.color = "#10b981";
        statusDiv.textContent =
            "Completato! " + answers.length +
            " risposte generate.";

    } catch (error) {

        statusDiv.style.color = "#dc2626";
        statusDiv.textContent =
            "Errore: " + error.message;

    } finally {

        processBtn.disabled = false;

    }

}

// Copia
async function copyResults() {

    try {

        await navigator.clipboard.writeText(
            resultBox.textContent
        );

        alert("Risposte copiate!");

    } catch (error) {

        alert("Copia non riuscita. Seleziona il testo.");

    }

}

</script>

</body>
</html>
