<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risolutore Quiz da Dispense</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 1.5rem;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .section {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            background-color: #fafafa;
        }

        .file-info {
            font-size: 0.875rem;
            color: #6b7280;
            margin-top: 0.25rem;
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.85rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        #status {
            margin-top: 1rem;
            font-weight: 500;
            text-align: center;
        }

        #result-container {
            margin-top: 1.5rem;
            display: none;
        }

        #result-box {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 6px;
            font-family: monospace;
            font-size: 1.1rem;
            word-break: break-all;
            white-space: pre-wrap;
        }

        .copy-btn {
            background-color: #10b981;
            margin-top: 0.5rem;
        }

        .copy-btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Risolutore Quiz con Dispense</h1>

        <!-- API KEY -->
        <div class="section">
            <label for="apiKey">Chiave API Gemini:</label>
            <input type="text" id="apiKey" placeholder="Incolla qui la tua API Key di Google Gemini">
        </div>

        <!-- DISPENSE -->
        <div class="section">
            <label for="dispenseFiles">1. Carica le Dispense / Materiale di Studio (PDF, Immagini):</label>
            <input type="file" id="dispenseFiles" multiple accept="application/pdf,image/*">
            <div class="file-info" id="dispenseCount">Nessun file selezionato</div>
        </div>

        <!-- IMMAGINI QUIZ -->
        <div class="section">
            <label for="quizFiles">2. Carica le Immagini dei Quiz (fino a 30):</label>
            <input type="file" id="quizFiles" multiple accept="image/*">
            <div class="file-info" id="quizCount">Nessuna immagine selezionata</div>
        </div>

        <!-- PULSANTE DI INVIO -->
        <button id="processBtn" onclick="processQuiz()">Elabora e Genera Risposte</button>

        <div id="status"></div>

        <!-- RISULTATO -->
        <div id="result-container">
            <label>Risultato:</label>
            <div id="result-box"></div>
            <button class="copy-btn" onclick="copyResults()">Copia Risultato</button>
        </div>
    </div>

    <script>
        // Aggiorna conteggio dei file selezionati
        document.getElementById('dispenseFiles').addEventListener('change', (e) => {
            document.getElementById('dispenseCount').textContent = `${e.target.files.length} file di studio caricati`;
        });

        document.getElementById('quizFiles').addEventListener('change', (e) => {
            const count = e.target.files.length;
            document.getElementById('quizCount').textContent = `${count} immagini di quiz caricate`;
            if (count > 30) {
                alert("Hai selezionato più di 30 immagini. Verranno considerate solo le prime 30.");
            }
        });

        // Funzione per convertire i file in formato Base64
        function fileToGenerativePart(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64Data = reader.result.split(',')[1];
                    resolve({
                        inlineData: {
                            data: base64Data,
                            mimeType: file.type
                        }
                    });
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function processQuiz() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const dispenseInput = document.getElementById('dispenseFiles').files;
            const quizInput = document.getElementById('quizFiles').files;
            const statusDiv = document.getElementById('status');
            const resultContainer = document.getElementById('result-container');
            const resultBox = document.getElementById('result-box');
            const btn = document.getElementById('processBtn');

            if (!apiKey) {
                alert("Inserisci una API Key valida!");
                return;
            }
            if (dispenseInput.length === 0) {
                alert("Carica almeno un file per le dispense!");
                return;
            }
            if (quizInput.length === 0) {
                alert("Carica almeno un'immagine per i quiz!");
                return;
            }

            btn.disabled = true;
            statusDiv.style.color = "#2563eb";
            statusDiv.textContent = "Conversione file e invio in corso... Attendi...";
            resultContainer.style.display = "none";

            try {
                // Prepara i file delle dispense
                const dispenseParts = [];
                for (let file of dispenseInput) {
                    dispenseParts.push(await fileToGenerativePart(file));
                }

                // Prepara le immagini dei quiz (max 30)
                const quizFilesToProcess = Array.from(quizInput).slice(0, 30);
                const quizParts = [];
                for (let file of quizFilesToProcess) {
                    quizParts.push(await fileToGenerativePart(file));
                }

                // Prompt rigoroso per forzare la ricerca solo nelle dispense e il formato di output
                const promptText = `
Sei un assistente per la risoluzione dei quiz.
Ti sono stati forniti due set di file:
1. I primi file allegati sono le DISPENSE / MATERIALE DI STUDIO.
2. I successivi allegati sono immagini contenenti DOMANDE DI QUIZ numerate sequentially (o una per immagine).

ISTRUZIONI RIGIDE:
- Rispondi alle domande dei quiz Basandoti ESCLUSIVAMENTE ed UNICAMENTE sulle informazioni presenti nelle DISPENSE fornite.
- Se una risposta non è direttamente o implicitamente supportata dalle dispense, indica la risposta più probabile secondo il contesto delle dispense stesse.
- L'output DEVE ESSERE ESATTAMENTE E SOLTANTO nel formato specificato, senza testi introduttivi, spiegazioni, spazi a capo inutili o formattazione markdown.
- Formato richiesto: 1:A;2:C;3:B;4:D...
- L'ordine numerico deve corrispondere all'ordine sequenziale dei quiz presentati nelle immagini.
`;

                const contents = [
                    {
                        role: "user",
                        parts: [
                            { text: promptText },
                            ...dispenseParts,
                            ...quizParts
                        ]
                    }
                ];

                // Chiamata all'API Gemini aggiornata al modello corretto
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ contents })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message || "Errore durante la chiamata API.");
                }

                const outputText = data.candidates[0].content.parts[0].text.trim();

                resultBox.textContent = outputText;
                resultContainer.style.display = "block";
                statusDiv.style.color = "#10b981";
                statusDiv.textContent = "Elaborazione completata!";

            } catch (err) {
                console.error(err);
                statusDiv.style.color = "#dc2626";
                statusDiv.textContent = "Si è verificato un errore: " + err.message;
            } finally {
                btn.disabled = false;
            }
        }

        function copyResults() {
            const text = document.getElementById('result-box').textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert("Risultati copiati negli appunti!");
            });
        }
    </script>
</body>
</html>
