<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Quiz Statistica</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#182230;background:#f3f5f8}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:920px;margin:0 auto;padding:32px 18px 60px}
header{margin-bottom:24px}h1{font-size:30px;letter-spacing:-.7px;margin:0 0 7px;color:#111827}header p{margin:0;color:#657184}
.panel{background:#fff;border:1px solid #e3e8ef;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 5px 20px #17203308}
label{display:block;font-weight:650;font-size:14px;margin-bottom:8px}
input[type=password]{width:100%;border:1px solid #cbd3df;border-radius:10px;padding:13px 14px;font-size:16px}
.drop{border:2px dashed #bac5d3;border-radius:14px;padding:28px 16px;text-align:center;background:#fafbfd;cursor:pointer}
.drop strong{display:block;margin-bottom:6px}.drop span{font-size:13px;color:#697789}
input[type=file]{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button{border:0;border-radius:10px;padding:13px 18px;font-weight:700;font-size:14px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#1d4ed8;color:white}.secondary{background:#edf1f6;color:#243044}
.meta{font-size:13px;color:#64748b;margin-top:12px}.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px;margin-top:14px}
.file{border:1px solid #e1e6ee;border-radius:9px;padding:9px;font-size:12px;overflow-wrap:anywhere;background:#fbfcfe}
.status{font-size:14px;margin-top:14px;color:#334155;white-space:pre-wrap}
.error{color:#b42318}.success{color:#067647}
.answer{border:1px solid #e1e7ef;border-radius:12px;padding:16px;margin:12px 0;background:#fff}
.answer-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}
.qnum{font-weight:800}.tag{font-size:11px;font-weight:800;letter-spacing:.3px;padding:5px 8px;border-radius:20px;background:#dcfce7;color:#166534}
.tag.review{background:#fff1d6;color:#92400e}
.answer p{margin:7px 0;line-height:1.48}.answer .why{font-size:13px;color:#526174;white-space:pre-wrap}
#results h2{font-size:20px;margin:0 0 12px}
.small{font-size:12px;color:#778396;line-height:1.5}
@media(max-width:600px){.wrap{padding:22px 12px 40px}h1{font-size:25px}.panel{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Quiz Statistica</h1>
  <p>Carica le schermate, analizza le domande e controlla le risposte.</p>
</header>

<section class="panel">
  <label for="password">Password privata di accesso</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="Inserisci la password">
  <div class="small" style="margin-top:8px">La password non viene salvata nel browser.</div>
</section>

<section class="panel">
  <label>Immagini del quiz</label>
  <label class="drop" for="picker">
    <strong>Seleziona fino a 24 immagini</strong>
    <span>JPG, PNG o WEBP · massimo 3 MB per immagine · 12 MB complessivi</span>
  </label>
  <input id="picker" type="file" accept="image/jpeg,image/png,image/webp" multiple>
  <div id="fileCount" class="meta">Nessuna immagine selezionata</div>
  <div id="fileList" class="files"></div>
  <div class="actions">
    <button id="analyze" class="primary" disabled>ANALIZZA LE IMMAGINI</button>
    <button id="clear" class="secondary" type="button">Pulisci</button>
  </div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
</section>

<section id="results" class="panel" hidden>
  <h2>Risultati</h2>
  <div id="answers"></div>
  <div id="notes" class="small"></div>
  <div class="actions">
    <button id="copy" class="primary">Copia tutte le risposte</button>
  </div>
</section>
</div>
<script>
const picker = document.getElementById("picker");
const password = document.getElementById("password");
const analyze = document.getElementById("analyze");
const clearBtn = document.getElementById("clear");
const statusBox = document.getElementById("status");
const fileList = document.getElementById("fileList");
const fileCount = document.getElementById("fileCount");
const results = document.getElementById("results");
const answersBox = document.getElementById("answers");
const notesBox = document.getElementById("notes");
let selectedFiles = [];
let copyText = "";

function setStatus(message, kind="") {
  statusBox.className = "status " + kind;
  statusBox.textContent = message;
}
function formatBytes(n) {
  return n < 1024*1024 ? (n/1024).toFixed(0)+" KB" : (n/1024/1024).toFixed(2)+" MB";
}
function refreshFiles() {
  fileList.replaceChildren();
  const total = selectedFiles.reduce((s,f)=>s+f.size,0);
  fileCount.textContent = selectedFiles.length
    ? `${selectedFiles.length}/24 immagini · ${formatBytes(total)} complessivi`
    : "Nessuna immagine selezionata";
  selectedFiles.forEach((f,i)=>{
    const div=document.createElement("div");
    div.className="file";
    div.textContent=`${i+1}. ${f.name} · ${formatBytes(f.size)}`;
    fileList.appendChild(div);
  });
  analyze.disabled = selectedFiles.length===0 || selectedFiles.length>24 || total>12*1024*1024;
}
picker.addEventListener("change",()=>{
  selectedFiles=Array.from(picker.files||[]);
  results.hidden=true;
  if(selectedFiles.length>24){setStatus("Hai selezionato più di 24 immagini. Selezionane al massimo 24.","error");}
  else if(selectedFiles.some(f=>f.size>3*1024*1024)){setStatus("Un'immagine supera 3 MB. Riduci la dimensione del file.","error");}
  else if(selectedFiles.reduce((s,f)=>s+f.size,0)>12*1024*1024){setStatus("Il totale supera 12 MB. Seleziona immagini più leggere.","error");}
  else setStatus("");
  refreshFiles();
});
clearBtn.addEventListener("click",()=>{
  selectedFiles=[];picker.value="";refreshFiles();results.hidden=true;setStatus("");
});
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve({mimeType:file.type,data:reader.result});
    reader.onerror=()=>reject(new Error("Impossibile leggere "+file.name));
    reader.readAsDataURL(file);
  });
}
function addText(parent,tag,text,className){
  const el=document.createElement(tag);el.textContent=text||"";
  if(className)el.className=className;
  parent.appendChild(el);return el;
}
function renderResult(data){
  answersBox.replaceChildren();
  const rows=data.answers||[];
  rows.forEach((a,i)=>{
    const card=document.createElement("article");card.className="answer";
    const top=document.createElement("div");top.className="answer-top";
    addText(top,"span",`Domanda ${a.numero||i+1}`,"qnum");
    const verified=a.stato==="VERIFICATA";
    addText(top,"span",verified?"VERIFICATA":"DA VERIFICARE","tag"+(verified?"":" review"));
    card.appendChild(top);
    const choice=[a.lettera,a.risposta].filter(Boolean).join(" — ");
    addText(card,"p",choice||"Risposta non determinata");
    if(a.motivo)addText(card,"p",a.motivo,"why");
    answersBox.appendChild(card);
  });
  notesBox.textContent=data.note_generali||"";
  copyText=rows.map((a,i)=>{
    const title=`Domanda ${a.numero||i+1}`;
    const answer=[a.lettera,a.risposta].filter(Boolean).join(" — ");
    return `${title}: ${answer}\nStato: ${a.stato||"DA_VERIFICARE"}\n${a.motivo||""}`;
  }).join("\n\n")+(data.note_generali?`\n\nNote: ${data.note_generali}`:"");
  results.hidden=false;
}
analyze.addEventListener("click",async()=>{
  if(!password.value.trim()){setStatus("Inserisci la password privata.","error");password.focus();return;}
  if(!selectedFiles.length)return;
  analyze.disabled=true;clearBtn.disabled=true;
  results.hidden=true;setStatus("Lettura delle immagini…");
  try{
    const images=[];
    for(let i=0;i<selectedFiles.length;i++){
      setStatus(`Preparazione immagini: ${i+1}/${selectedFiles.length}`);
      images.push(await fileToBase64(selectedFiles[i]));
    }
    setStatus("Analisi statistica in corso. Attendi senza chiudere la pagina…");
    const response=await fetch("/api/analyze",{
      method:"POST",
      headers:{"content-type":"application/json","x-app-password":password.value},
      body:JSON.stringify({images})
    });
    const payload=await response.json().catch(()=>({error:"Risposta del server non valida."}));
    if(!response.ok)throw new Error(payload.error||`Errore ${response.status}`);
    renderResult(payload.result);
    setStatus(`Analisi completata · ${payload.model||"Gemini"}`,"success");
  }catch(err){
    setStatus(err.message||"Errore durante l'analisi. Riprova.","error");
  }finally{
    analyze.disabled=selectedFiles.length===0 || selectedFiles.length>24 || selectedFiles.reduce((s,f)=>s+f.size,0)>12*1024*1024;
    clearBtn.disabled=false;
  }
});
document.getElementById("copy").addEventListener("click",async()=>{
  try{await navigator.clipboard.writeText(copyText);setStatus("Risposte copiate negli appunti.","success");}
  catch{setStatus("Copia non disponibile: seleziona il testo dei risultati.","error");}
});
</script>
</body>
</html>
